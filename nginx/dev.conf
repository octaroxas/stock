server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dev: sem cache e sem sendfile, para ver a edição na hora (bind mount no WSL/Docker Desktop)
    sendfile off;
    add_header Cache-Control "no-store" always;

    # Rotas sem extensão: /09-fluxo-geral serve 09-fluxo-geral.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ \.md$ {
        return 404;
    }
}
