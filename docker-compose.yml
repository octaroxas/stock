# Produção: stock.octacilio.dev.br
#   docker compose up -d
# Atualizar conteúdo: git pull (os arquivos são montados, não precisa rebuild nem restart).
# O container escuta só em 127.0.0.1:${WEB_PORT:-8081}; o proxy reverso da VPS (TLS) aponta para essa porta.
services:
  web:
    image: nginx:1.27-alpine
    container_name: stock-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - ./docs/fluxos:/usr/share/nginx/html:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
